<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion – Studio Prompter</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body class="bg-zinc-900 flex items-center justify-center h-screen text-white">

    <div class="bg-zinc-800 p-10 rounded-2xl border border-zinc-700 text-center w-80">
        <i data-lucide="log-in" class="mx-auto mb-4" style="width: 48px; height: 48px;"></i>
        <h1 class="text-xl font-semibold mb-4">Studio Prompter</h1>

        <button id="loginGoogle"
            class="w-full py-3 bg-blue-600 hover:bg-blue-500 rounded-lg font-semibold flex items-center justify-center gap-2">
            <i data-lucide="chrome"></i>
            Connexion avec Google
        </button>
    </div>

    <script type="module">
        import { supabase } from "/supabase.js";

        document.getElementById("loginGoogle").addEventListener("click", async () => {
            await supabase.auth.signInWithOAuth({
                provider: 'google',
                options: {
                    redirectTo: window.location.origin + "/login.html" 
                    // on revient ici pour vérifier la session
                }
            });
        });

        // Vérifie si l'utilisateur est déjà connecté
        const { data } = await supabase.auth.getSession();
        if (data.session) {
            // Session déjà active → accès autorisé
            window.location.href = "/index.html";
        }

        lucide.createIcons();
    </script>

</body>
</html>
