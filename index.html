<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">

    <!-- Mobile & PWA -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0F1115">

    <!-- Application -->
    <title>Studio Prompter</title>
    <meta name="description" content="Teleprompter professionnel, optimisé pour créateurs.">

    <!-- Web App manifest -->
    <link rel="manifest" href="/manifest.json">

    <!-- Icons -->
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="/icons/icon-512.png">
    <link rel="apple-touch-icon" href="/icons/icon-512.png">

    <!-- Fullscreen Web App sur iOS -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- PDF.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc =
            "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
    </script>
</head>

<body class="app">

    <!-- SCROLL AREA -->
    <div id="scroller" class="scroll-zone hide-scrollbar">

        <!-- Écran d'accueil -->
        <div id="empty" class="empty-state">
            <div class="empty-card">
                <i data-lucide="monitor-play" class="icon-main"></i>
                <h1>Studio Prompter</h1>
                <p class="subtitle">Interface pro pour créateurs</p>

                <label class="upload-btn">
                    <i data-lucide="upload-cloud" class="mr-2"></i>
                    Charger un PDF
                    <input type="file" id="fileInput" accept="application/pdf" multiple hidden>
                </label>
            </div>
        </div>

        <!-- Zone des PDF -->
        <div id="pdfArea" class="pdf-area"></div>
    </div>

    <!-- HUD -->
    <div id="hud" class="hud">

        <!-- Ligne 1 -->
        <div class="hud-row">

            <button id="toggleBtn" class="play-btn">
                <i data-lucide="play"></i>
            </button>

            <div class="slider-box">
                <i data-lucide="turtle"></i>
                <input type="range" id="speed" min="0.2" max="5" step="0.1" value="1.5">
                <i data-lucide="rabbit"></i>
            </div>

            <button id="settingsBtn" class="hud-btn">
                <i data-lucide="settings-2"></i>
            </button>
        </div>

        <!-- PANEL PARAMÈTRES -->
        <div id="advanced" class="advanced hidden">

            <!-- Bouton retour -->
            <button id="closeSettings" class="settings-close">
                <i data-lucide="x"></i>
            </button>

            <!-- ⚠️ Cette zone sera remplie AUTOMATIQUEMENT par main.js -->
            <div id="settingsContent"></div>

        </div>
    </div>

    <!-- Zone invisible utilisée pour interactions tactiles -->
    <div id="tap-zone" class="absolute inset-0 z-30 hidden"></div>

    <!-- App JS (Vite) -->
    <script type="module" src="/src/main.js"></script>

    <!-- Lucide init -->
    <script>
        lucide.createIcons();
    </script>

    <!-- Service Worker -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/service-worker.js')
                    .then(() => console.log("Service Worker registered"))
                    .catch(err => console.error("SW error:", err));
            });
        }
    </script>

</body>
</html>
