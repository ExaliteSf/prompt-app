<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Studio Prompter</title>

    <!-- Tailwind -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- CSS -->
    <link rel="stylesheet" href="src/style.css">

    <!-- PDF.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc =
            "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
    </script>
</head>

<body class="app">

    <!-- SCROLL AREA -->
    <div id="scroller" class="scroll-zone hide-scrollbar">

        <!-- Écran d'accueil -->
        <div id="empty" class="empty-state">
            <div class="empty-card">
                <i data-lucide="monitor-play" class="icon-main"></i>
                <h1>Studio Prompter</h1>
                <p class="subtitle">Interface pro pour créateurs</p>

                <label class="upload-btn">
                    <i data-lucide="upload-cloud" class="mr-2"></i>
                    Charger un PDF
                    <input type="file" id="fileInput" accept="application/pdf" multiple hidden>
                </label>
            </div>
        </div>

        <!-- Zone des PDF -->
        <div id="pdfArea" class="pdf-area"></div>
    </div>

    <!-- HUD -->
    <div id="hud" class="hud">

        <!-- Ligne 1 -->
        <div class="hud-row">

            <button id="toggleBtn" class="play-btn">
                <i data-lucide="play"></i>
            </button>

            <div class="slider-box">
                <i data-lucide="turtle"></i>
                <input type="range" id="speed" min="0.2" max="5" step="0.1" value="1.5">
                <i data-lucide="rabbit"></i>
            </div>

            <button id="settingsBtn" class="hud-btn">
                <i data-lucide="settings-2"></i>
            </button>
        </div>

        <!-- Options avancées (VIDES — rempli via JS) -->
        <div id="advanced" class="advanced hidden"></div>

    </div>

    <div id="tap-zone" class="absolute inset-0 z-30 hidden"></div>

    <script src="src/main.js"></script>
    <script>
        lucide.createIcons();
    </script>
</body>

</html>
